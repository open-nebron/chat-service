name: CI/CD

on:
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      scylla:
        image: scylladb/scylla:5.4
        ports:
          - 9042:9042
        options: >-
          --smp 1
          --memory 1G
          --overprovisioned 1
          --developer-mode 1

    steps:
      - name: Checkout chat-service
        uses: actions/checkout@v4
        with:
          path: chat-service

      - name: Checkout shared-contracts
        uses: actions/checkout@v4
        with:
          repository: open-nebron/shared-contracts
          path: shared-contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chat-service/package-lock.json

      - name: Install dependencies
        working-directory: chat-service
        run: npm ci

      - name: Run linter
        working-directory: chat-service
        run: npm run lint

      - name: Compile TypeScript
        working-directory: chat-service
        run: npm run build

      - name: Wait for ScyllaDB
        working-directory: chat-service
        run: |
          node -e "
            import('cassandra-driver').then(async ({ default: cassandra }) => {
              const client = new cassandra.Client({ contactPoints: ['127.0.0.1:9042'], localDataCenter: 'datacenter1' });
              for (let i = 0; i < 45; i++) {
                try {
                  await client.connect();
                  console.log('ScyllaDB is ready!');
                  await client.shutdown();
                  return process.exit(0);
                } catch (e) {
                  console.log('Waiting for ScyllaDB... attempt', i + 1);
                  await new Promise(r => setTimeout(r, 2000));
                }
              }
              process.exit(1);
            });
          "

      - name: Run test suite
        working-directory: chat-service
        run: npm test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout chat-service
        uses: actions/checkout@v4
        with:
          path: chat-service

      - name: Checkout shared-contracts
        uses: actions/checkout@v4
        with:
          repository: open-nebron/shared-contracts
          path: shared-contracts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f chat-service/Dockerfile -t nebron-chat-service:ci .
