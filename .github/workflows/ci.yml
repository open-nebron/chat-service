name: CI/CD

on:
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chat-service
        uses: actions/checkout@v4
        with:
          path: chat-service

      - name: Checkout shared-contracts
        uses: actions/checkout@v4
        with:
          repository: open-nebron/shared-contracts
          path: shared-contracts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chat-service/package-lock.json

      - name: Install dependencies
        working-directory: chat-service
        run: npm ci

      - name: Run linter
        working-directory: chat-service
        run: npm run lint

      - name: Compile TypeScript
        working-directory: chat-service
        run: npm run build

      - name: Run test suite
        working-directory: chat-service
        run: npm test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout chat-service
        uses: actions/checkout@v4
        with:
          path: chat-service

      - name: Checkout shared-contracts
        uses: actions/checkout@v4
        with:
          repository: open-nebron/shared-contracts
          path: shared-contracts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f chat-service/Dockerfile -t zenuxs-chat-service:ci .
